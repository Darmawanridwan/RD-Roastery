<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Products — RD Roastery Admin</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f4f0e8;

            color: #211b17;

        }


        /* =========================================
           SIDEBAR
        ========================================= */

        .sidebar {

            position: fixed;

            left: 0;
            top: 0;

            width: 250px;
            height: 100vh;

            background: #211b17;

            color: #f4f0e8;

            padding: 35px 25px;

        }


        .logo {

            font-family: Georgia, serif;

            font-size: 24px;

            letter-spacing: 3px;

            margin-bottom: 60px;

        }


        .admin-label {

            font-size: 11px;

            letter-spacing: 2px;

            color: #aaa29a;

            margin-bottom: 20px;

        }


        .nav {

            display: flex;

            flex-direction: column;

            gap: 12px;

        }


        .nav a {

            display: block;

            text-decoration: none;

            color: #d8d1c8;

            padding: 13px 12px;

            font-size: 14px;

            border-radius: 5px;

        }


        .nav a:hover,
        .nav a.active {

            background: #3a312b;

            color: white;

        }


        .logout {

            position: absolute;

            bottom: 30px;

            left: 25px;

            right: 25px;

            border: 1px solid #5b5048;

            background: transparent;

            color: #ddd;

            padding: 12px;

            cursor: pointer;

            border-radius: 5px;

        }


        .logout:hover {

            background: #3a312b;

        }


        /* =========================================
           MAIN
        ========================================= */

        .main {

            margin-left: 250px;

            padding: 45px;

        }


        .topbar {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 35px;

        }


        .page-title {

            font-family: Georgia, serif;

            font-size: 38px;

        }


        .admin-info {

            text-align: right;

            font-size: 13px;

            color: #6f665e;

        }


        .admin-info strong {

            display: block;

            color: #211b17;

            margin-bottom: 4px;

        }


        /* =========================================
           ACTION BAR
        ========================================= */

        .action-bar {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;

        }


        .product-count {

            font-size: 12px;

            letter-spacing: 1px;

            color: #81766d;

        }


        .add-btn {

            border: none;

            background: #211b17;

            color: white;

            padding: 13px 20px;

            cursor: pointer;

            border-radius: 4px;

            font-size: 13px;

        }


        .add-btn:hover {

            background: #3a312b;

        }


        /* =========================================
           TABLE
        ========================================= */

        .table-container {

            background: white;

            border: 1px solid #ddd5ca;

            overflow-x: auto;

        }


        table {

            width: 100%;

            border-collapse: collapse;

            min-width: 1100px;

        }


        th {

            text-align: left;

            padding: 16px;

            background: #eee9e1;

            font-size: 11px;

            letter-spacing: 1px;

            text-transform: uppercase;

            color: #665d56;

        }


        td {

            padding: 15px 16px;

            border-top: 1px solid #eee9e1;

            font-size: 13px;

            vertical-align: middle;

        }


        tr:hover td {

            background: #faf8f4;

        }


        .product-name {

            font-weight: bold;

        }


        .category {

            color: #766c64;

        }


        .price {

            white-space: nowrap;

        }


        .available {

            display: inline-block;

            padding: 6px 10px;

            border-radius: 20px;

            background: #e8eee6;

            color: #40513d;

            font-size: 11px;

        }


        .unavailable {

            display: inline-block;

            padding: 6px 10px;

            border-radius: 20px;

            background: #eee0dc;

            color: #70453d;

            font-size: 11px;

        }


        /* =========================================
           BUTTONS
        ========================================= */

        .actions {

            display: flex;

            gap: 7px;

        }


        .edit-btn,
        .delete-btn {

            padding: 7px 11px;

            font-size: 11px;

            cursor: pointer;

            border-radius: 3px;

        }


        .edit-btn {

            border: 1px solid #211b17;

            background: transparent;

            color: #211b17;

        }


        .edit-btn:hover {

            background: #211b17;

            color: white;

        }


        .delete-btn {

            border: 1px solid #8c4d42;

            background: transparent;

            color: #8c4d42;

        }


        .delete-btn:hover {

            background: #8c4d42;

            color: white;

        }


        /* =========================================
           MODAL
        ========================================= */

        .modal {

            display: none;

            position: fixed;

            z-index: 1000;

            inset: 0;

            background: rgba(0, 0, 0, 0.55);

            padding: 30px;

            overflow-y: auto;

        }


        .modal-content {

            max-width: 950px;

            margin: 20px auto;

            background: #f4f0e8;

            padding: 35px;

            position: relative;

        }


        .close {

            position: absolute;

            right: 25px;

            top: 18px;

            font-size: 28px;

            color: #6c625a;

            cursor: pointer;

        }


        .modal-title {

            font-family: Georgia, serif;

            font-size: 30px;

            margin-bottom: 30px;

        }


        /* =========================================
           FORM
        ========================================= */

        .form-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 18px;

        }


        .form-group {

            display: flex;

            flex-direction: column;

        }


        .form-group.full {

            grid-column: 1 / -1;

        }


        label {

            font-size: 10px;

            letter-spacing: 1.5px;

            text-transform: uppercase;

            color: #6f665e;

            margin-bottom: 8px;

        }


        input,
        select,
        textarea {

            width: 100%;

            padding: 12px;

            border: 1px solid #cfc7bd;

            background: white;

            color: #211b17;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 14px;

            outline: none;

        }


        input:focus,
        select:focus,
        textarea:focus {

            border-color: #211b17;

        }


        textarea {

            min-height: 90px;

            resize: vertical;

        }


        .checkbox-group {

            display: flex;

            align-items: center;

            gap: 10px;

            margin-top: 5px;

        }


        .checkbox-group input {

            width: auto;

        }


        .checkbox-group label {

            margin: 0;

            font-size: 12px;

            letter-spacing: 0;

            text-transform: none;

            color: #211b17;

        }


        /* =========================================
           FORM ACTION
        ========================================= */

        .form-actions {

            display: flex;

            justify-content: flex-end;

            gap: 10px;

            margin-top: 30px;

            padding-top: 25px;

            border-top: 1px solid #ddd5ca;

        }


        .cancel-btn {

            border: 1px solid #aaa29a;

            background: transparent;

            color: #211b17;

            padding: 12px 20px;

            cursor: pointer;

        }


        .save-btn {

            border: none;

            background: #211b17;

            color: white;

            padding: 12px 25px;

            cursor: pointer;

        }


        .save-btn:hover {

            background: #3a312b;

        }


        .message {

            margin-top: 15px;

            font-size: 13px;

        }


        .success {

            color: #40513d;

        }


        .error {

            color: #8c4d42;

        }


        /* =========================================
           LOADING
        ========================================= */

        .loading {

            padding: 40px;

            text-align: center;

            color: #766c64;

        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 900px) {

            .sidebar {

                width: 200px;

            }


            .main {

                margin-left: 200px;

                padding: 25px;

            }

        }


        @media (max-width: 650px) {

            .sidebar {

                position: relative;

                width: 100%;

                height: auto;

            }


            .logout {

                position: static;

                margin-top: 25px;

                width: 100%;

            }


            .main {

                margin-left: 0;

            }


            .topbar {

                flex-direction: column;

                align-items: flex-start;

                gap: 15px;

            }


            .admin-info {

                text-align: left;

            }


            .form-grid {

                grid-template-columns: 1fr;

            }


            .form-group.full {

                grid-column: auto;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         SIDEBAR
    ========================================= -->

    <aside class="sidebar">

        <div class="logo">
            RD ROASTERY
        </div>


        <div class="admin-label">
            ADMIN PORTAL
        </div>


        <nav class="nav">

            <a
                href="/admin-dashboard.html"
            >
                Dashboard
            </a>


            <a
                href="/admin-products.html"
                class="active"
            >
                Products
            </a>


            <a
                href="/admin-dashboard.html#custom-requests"
            >
                Custom Requests
            </a>

        </nav>


        <button
            class="logout"
            onclick="logout()"
        >
            LOG OUT
        </button>

    </aside>



    <!-- =========================================
         MAIN
    ========================================= -->

    <main class="main">


        <div class="topbar">

            <h1 class="page-title">
                Products
            </h1>


            <div class="admin-info">

                <strong id="admin-name">
                    Admin RD Roastery
                </strong>

                <span id="admin-email">
                    admin@rdroastery.com
                </span>

            </div>

        </div>



        <div class="action-bar">

            <div
                class="product-count"
                id="product-count"
            >
                0 PRODUCTS
            </div>


            <button
                class="add-btn"
                onclick="openAddModal()"
            >
                + ADD PRODUCT
            </button>

        </div>



        <div class="table-container">

            <div
                id="loading"
                class="loading"
            >
                Loading products...
            </div>


            <table
                id="product-table"
                style="display:none;"
            >

                <thead>

                    <tr>

                        <th>Product</th>

                        <th>Category</th>

                        <th>Origin</th>

                        <th>Roast</th>

                        <th>Brewing</th>

                        <th>Weight</th>

                        <th>Price</th>

                        <th>Availability</th>

                        <th>Actions</th>

                    </tr>

                </thead>


                <tbody
                    id="product-body"
                ></tbody>

            </table>

        </div>

    </main>



    <!-- =========================================
         PRODUCT MODAL
    ========================================= -->

    <div
        class="modal"
        id="product-modal"
    >

        <div class="modal-content">


            <span
                class="close"
                onclick="closeModal()"
            >
                ×
            </span>


            <h2
                class="modal-title"
                id="modal-title"
            >
                Add Product
            </h2>


            <form
                id="product-form"
            >

                <div class="form-grid">


                    <div class="form-group full">

                        <label>
                            Product Name *
                        </label>

                        <input
                            type="text"
                            id="name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Category
                        </label>

                        <select id="category">

                            <option value="">
                                Select Category
                            </option>

                            <option value="House Blend">
                                House Blend
                            </option>

                            <option value="Filter Coffee">
                                Filter Coffee
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>
                            Origin
                        </label>

                        <input
                            type="text"
                            id="origin"
                            placeholder="Indonesia"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Region
                        </label>

                        <input
                            type="text"
                            id="region"
                            placeholder="Ciwidey"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Processing
                        </label>

                        <select id="processing">

                            <option value="">
                                Select Processing
                            </option>

                            <option value="Washed">
                                Washed
                            </option>

                            <option value="Natural">
                                Natural
                            </option>

                            <option value="Honey">
                                Honey
                            </option>

                            <option value="Anaerobic">
                                Anaerobic
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>
                            Roast Level
                        </label>

                        <select id="roast_level">

                            <option value="">
                                Select Roast
                            </option>

                            <option value="Light">
                                Light
                            </option>

                            <option value="Medium Light">
                                Medium Light
                            </option>

                            <option value="Medium">
                                Medium
                            </option>

                            <option value="Medium Dark">
                                Medium Dark
                            </option>

                            <option value="Dark">
                                Dark
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>
                            Brewing Method
                        </label>

                        <input
                            type="text"
                            id="brewing_method"
                            placeholder="Espresso / V60 / Manual Brew"
                        >

                    </div>


                    <div class="form-group full">

                        <label>
                            Tasting Notes
                        </label>

                        <input
                            type="text"
                            id="tasting_notes"
                            placeholder="Chocolate, caramel, nutty"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Acidity
                        </label>

                        <select id="acidity">

                            <option value="">
                                Select
                            </option>

                            <option value="Low">
                                Low
                            </option>

                            <option value="Medium">
                                Medium
                            </option>

                            <option value="High">
                                High
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>
                            Body
                        </label>

                        <select id="body">

                            <option value="">
                                Select
                            </option>

                            <option value="Light">
                                Light
                            </option>

                            <option value="Medium">
                                Medium
                            </option>

                            <option value="Full">
                                Full
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>
                            Sweetness
                        </label>

                        <select id="sweetness">

                            <option value="">
                                Select
                            </option>

                            <option value="Low">
                                Low
                            </option>

                            <option value="Medium">
                                Medium
                            </option>

                            <option value="High">
                                High
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>
                            Weight (gram)
                        </label>

                        <input
                            type="number"
                            id="weight"
                            min="0"
                            placeholder="250"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Price (Rp)
                        </label>

                        <input
                            type="number"
                            id="price"
                            min="0"
                            placeholder="95000"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Image URL
                        </label>

                        <input
                            type="text"
                            id="image"
                            placeholder="images/coffee.jpg"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Availability
                        </label>


                        <div class="checkbox-group">

                            <input
                                type="checkbox"
                                id="availability"
                                checked
                            >


                            <label
                                for="availability"
                            >
                                Product available
                            </label>

                        </div>

                    </div>


                </div>


                <div
                    id="form-message"
                    class="message"
                ></div>


                <div class="form-actions">

                    <button
                        type="button"
                        class="cancel-btn"
                        onclick="closeModal()"
                    >
                        CANCEL
                    </button>


                    <button
                        type="submit"
                        class="save-btn"
                    >
                        SAVE PRODUCT
                    </button>

                </div>


            </form>

        </div>

    </div>



    <script>


        // =========================================
        // ADMIN LOGIN PROTECTION
        // =========================================

        const adminData =
            localStorage.getItem("rd_admin");


        if (!adminData) {

            window.location.href =
                "/admin-login.html";

        }


        // =========================================
        // ADMIN INFO
        // =========================================

        if (adminData) {

            try {

                const admin =
                    JSON.parse(adminData);


                if (admin.name) {

                    document.getElementById(
                        "admin-name"
                    ).textContent =
                        admin.name;

                }


                if (admin.email) {

                    document.getElementById(
                        "admin-email"
                    ).textContent =
                        admin.email;

                }

            } catch (error) {

                console.error(
                    "Failed to read admin data:",
                    error
                );


                localStorage.removeItem(
                    "rd_admin"
                );


                window.location.href =
                    "/admin-login.html";

            }

        }



        // =========================================
        // VARIABLES
        // =========================================

        let products = [];

        let editingProductId = null;



        // =========================================
        // LOAD PRODUCTS
        // =========================================

        async function loadProducts() {

            const loading =
                document.getElementById(
                    "loading"
                );

            const table =
                document.getElementById(
                    "product-table"
                );

            const tbody =
                document.getElementById(
                    "product-body"
                );


            loading.style.display =
                "block";

            table.style.display =
                "none";

            tbody.innerHTML = "";


            try {

                const response =
                    await fetch(
                        "/api/products"
                    );


                if (!response.ok) {

                    throw new Error(
                        "Failed to load products"
                    );

                }


                const result =
                    await response.json();


                products =
                    result.data || [];


                document.getElementById(
                    "product-count"
                ).textContent =
                    `${products.length} PRODUCT${
                        products.length !== 1
                            ? "S"
                            : ""
                    }`;


                if (
                    products.length === 0
                ) {

                    loading.textContent =
                        "Belum ada produk.";

                    return;

                }


                products.forEach(
                    product => {

                        const row =
                            document.createElement(
                                "tr"
                            );


                        const availability =
                            Number(
                                product.availability
                            ) === 1;


                        row.innerHTML = `

                            <td>

                                <div class="product-name">

                                    ${
                                        product.name
                                        || "-"
                                    }

                                </div>

                            </td>


                            <td>

                                <div class="category">

                                    ${
                                        product.category
                                        || "-"
                                    }

                                </div>

                            </td>


                            <td>

                                ${
                                    product.origin
                                    || "-"
                                }

                                ${
                                    product.region
                                        ? " · "
                                        + product.region
                                        : ""
                                }

                            </td>


                            <td>

                                ${
                                    product.roast_level
                                    || "-"
                                }

                            </td>


                            <td>

                                ${
                                    product.brewing_method
                                    || "-"
                                }

                            </td>


                            <td>

                                ${
                                    product.weight
                                    ? product.weight
                                        + " g"
                                    : "-"
                                }

                            </td>


                            <td>

                                <div class="price">

                                    Rp ${
                                        Number(
                                            product.price
                                            || 0
                                        ).toLocaleString(
                                            "id-ID"
                                        )
                                    }

                                </div>

                            </td>


                            <td>

                                <span
                                    class="${
                                        availability
                                            ? "available"
                                            : "unavailable"
                                    }"
                                >

                                    ${
                                        availability
                                            ? "Available"
                                            : "Unavailable"
                                    }

                                </span>

                            </td>


                            <td>

                                <div class="actions">

                                    <button
                                        class="edit-btn"
                                        onclick="openEditModal(${product.id})"
                                    >
                                        EDIT
                                    </button>


                                    <button
                                        class="delete-btn"
                                        onclick="deleteProduct(${product.id})"
                                    >
                                        DELETE
                                    </button>

                                </div>

                            </td>

                        `;


                        tbody.appendChild(
                            row
                        );

                    }
                );


                loading.style.display =
                    "none";

                table.style.display =
                    "table";


            } catch (error) {

                console.error(error);

                loading.textContent =
                    "Gagal mengambil data produk.";

            }

        }



        // =========================================
        // OPEN ADD MODAL
        // =========================================

        function openAddModal() {

            editingProductId =
                null;


            document.getElementById(
                "modal-title"
            ).textContent =
                "Add Product";


            document.getElementById(
                "product-form"
            ).reset();


            document.getElementById(
                "availability"
            ).checked =
                true;


            document.getElementById(
                "form-message"
            ).textContent =
                "";


            document.getElementById(
                "product-modal"
            ).style.display =
                "block";

        }



        // =========================================
        // OPEN EDIT MODAL
        // =========================================

        function openEditModal(id) {

            const product =
                products.find(
                    item =>
                        Number(item.id) ===
                        Number(id)
                );


            if (!product) {

                alert(
                    "Product tidak ditemukan."
                );

                return;

            }


            editingProductId =
                id;


            document.getElementById(
                "modal-title"
            ).textContent =
                "Edit Product";


            document.getElementById(
                "name"
            ).value =
                product.name || "";


            document.getElementById(
                "category"
            ).value =
                product.category || "";


            document.getElementById(
                "origin"
            ).value =
                product.origin || "";


            document.getElementById(
                "region"
            ).value =
                product.region || "";


            document.getElementById(
                "processing"
            ).value =
                product.processing || "";


            document.getElementById(
                "roast_level"
            ).value =
                product.roast_level || "";


            document.getElementById(
                "brewing_method"
            ).value =
                product.brewing_method || "";


            document.getElementById(
                "tasting_notes"
            ).value =
                product.tasting_notes || "";


            document.getElementById(
                "acidity"
            ).value =
                product.acidity || "";


            document.getElementById(
                "body"
            ).value =
                product.body || "";


            document.getElementById(
                "sweetness"
            ).value =
                product.sweetness || "";


            document.getElementById(
                "weight"
            ).value =
                product.weight || "";


            document.getElementById(
                "price"
            ).value =
                product.price || "";


            document.getElementById(
                "image"
            ).value =
                product.image || "";


            document.getElementById(
                "availability"
            ).checked =
                Number(
                    product.availability
                ) === 1;


            document.getElementById(
                "form-message"
            ).textContent =
                "";


            document.getElementById(
                "product-modal"
            ).style.display =
                "block";

        }



        // =========================================
        // SUBMIT FORM
        // =========================================

        document.getElementById(
            "product-form"
        ).addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const message =
                    document.getElementById(
                        "form-message"
                    );


                message.className =
                    "message";

                message.textContent =
                    "Saving product...";


                const data = {

                    name:
                        document.getElementById(

                        ).value.trim(),

                    category:
                        document.getElementById(

                        ).value,

                    origin:
                        document.getElementById(

                    region:

                    processing:

                    roast_level:

                try {

                    if (

                    ) {

                            await fetch(

                                {

                                    method:
                                        "POST",

                                    headers: {

                                        "Content-Type":
                                            "application/json"

                                    },

                                    body:
                                        JSON.stringify(
                                            data
                                        )

                                }
                            );

                    else {

                            await fetch(

                                {

                                        )

        // =========================================
        // DELETE PRODUCT
        // =========================================

        async function deleteProduct(id) {

            const product =
                products.find(
                    item =>
                        Number(item.id) ===
                        Number(id)
                );


            if (!product) {

                return;

            }


            const confirmed =
                confirm(
                    `Yakin ingin menghapus produk "${product.name}"?`
                );


            if (!confirmed) {

                return;

            }


            try {

                const response =
                    await fetch(

                        `/api/products/${id}`,

                        {

                            method:
                                "DELETE"

                        }

                    );


                const result =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        result.message ||
                        "Failed to delete product"
                    );

                }


                alert(
                    "Product berhasil dihapus."
                );


                await loadProducts();


            } catch (error) {

                console.error(
                    error
                );


                alert(
                    "Gagal menghapus product: "
                    + error.message
                );

            }

        }



        // =========================================
        // CLOSE MODAL
        // =========================================

        function closeModal() {

            document.getElementById(
                "product-modal"
            ).style.display =
                "none";

        }


        window.onclick =
            function(event) {

                const modal =
                    document.getElementById(
                        "product-modal"
                    );


                if (
                    event.target ===
                    modal
                ) {

                    closeModal();

                }

            };



        // =========================================
        // LOGOUT
        // =========================================

        function logout() {

            localStorage.removeItem(
                "rd_admin"
            );

            window.location.href =
                "/admin-login.html";

        }



        // =========================================
        // INITIAL LOAD
        // =========================================

        loadProducts();

    </script>
