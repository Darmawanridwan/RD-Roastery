
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Requests — RD Roastery Admin</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f0e8;
            color: #211b17;
        }

        /* SIDEBAR — SAME AS PRODUCTS */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            height: 100vh;
            background: #211b17;
            color: #f4f0e8;
            padding: 35px 25px;
        }

        .logo {
            font-family: Georgia, serif;
            font-size: 24px;
            letter-spacing: 3px;
            margin-bottom: 60px;
        }

        .admin-label {
            font-size: 11px;
            letter-spacing: 2px;
            color: #aaa29a;
            margin-bottom: 20px;
        }

        .nav {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nav a {
            display: block;
            text-decoration: none;
            color: #d8d1c8;
            padding: 13px 12px;
            font-size: 14px;
            border-radius: 5px;
        }

        .nav a:hover,
        .nav a.active {
            background: #3a312b;
            color: white;
        }

        .logout {
            position: absolute;
            bottom: 30px;
            left: 25px;
            right: 25px;
            width: calc(100% - 50px);
            border: 1px solid #5b5048;
            background: transparent;
            color: #ddd;
            padding: 12px;
            cursor: pointer;
            border-radius: 5px;
        }

        .logout:hover {
            background: #3a312b;
        }

        /* MAIN — SAME AS PRODUCTS */

        .main {
            margin-left: 250px;
            padding: 45px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            gap: 20px;
        }

        .page-title {
            font-family: Georgia, serif;
            font-size: 38px;
        }

        .admin-info {
            text-align: right;
            font-size: 13px;
            color: #6f665e;
        }

        .admin-info strong {
            display: block;
            color: #211b17;
            margin-bottom: 4px;
        }

        /* ACTION BAR — SAME AS PRODUCTS */

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }

        .request-count {
            font-size: 12px;
            letter-spacing: 1px;
            color: #81766d;
        }

        .add-btn {
            border: none;
            background: #211b17;
            color: white;
            padding: 13px 20px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 13px;
        }

        .add-btn:hover {
            background: #3a312b;
        }

        /* FILTERS */

        .filters {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .search-input,
        .filter-select {
            font-family: Arial, Helvetica, sans-serif;
            background: white;
            color: #211b17;
            border: 1px solid #ddd5ca;
            padding: 12px;
            font-size: 13px;
            border-radius: 3px;
            outline: none;
        }

        .search-input {
            flex: 1;
            min-width: 100px;
        }

        .search-input:focus,
        .filter-select:focus {
            border-color: #81766d;
        }

        /* TABLE — SAME AS PRODUCTS */

        .table-container {
            background: white;
            border: 1px solid #ddd5ca;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        th {
            text-align: left;
            padding: 16px;
            background: #eee9e1;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #665d56;
            white-space: nowrap;
        }

        td {
            padding: 15px 16px;
            border-top: 1px solid #eee9e1;
            font-size: 13px;
            vertical-align: middle;
        }

        tr:hover td {
            background: #faf8f4;
        }

        .business-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .secondary-text {
            color: #766c64;
            font-size: 11px;
            line-height: 1.6;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 11px;
            white-space: nowrap;
        }

        .status-new {
            background: #e8eee6;
            color: #40513d;
        }

        .status-in-progress {
            background: #f4ead5;
            color: #805b25;
        }

        .status-sample-roasting {
            background: #e9e1ef;
            color: #654c78;
        }

        .status-completed {
            background: #dcebdd;
            color: #365d39;
        }

        .status-cancelled {
            background: #eee0dc;
            color: #70453d;
        }

        /* TABLE BUTTONS */

        .actions {
            display: flex;
            gap: 7px;
        }

        .edit-btn,
        .delete-btn {
            padding: 7px 11px;
            font-size: 11px;
            cursor: pointer;
            border-radius: 3px;
        }

        .edit-btn {
            border: 1px solid #211b17;
            background: transparent;
            color: #211b17;
        }

        .edit-btn:hover {
            background: #211b17;
            color: white;
        }

        .delete-btn {
            border: 1px solid #8c4d42;
            background: transparent;
            color: #8c4d42;
        }

        .delete-btn:hover {
            background: #8c4d42;
            color: white;
        }

        .loading {
            text-align: center;
            padding: 35px;
            font-size: 13px;
            color: #766c64;
        }

        .notice {
            display: none;
            margin-bottom: 20px;
            padding: 14px 16px;
            font-size: 13px;
            line-height: 1.5;
            border: 1px solid #ddd5ca;
            background: white;
        }

        .notice.show {
            display: block;
        }

        .notice.error {
            color: #8c4d42;
            border-color: #cda69e;
        }

        .notice.success {
            color: #40513d;
            border-color: #b6c9b0;
        }

        /* MODAL */

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            padding: 30px;
            overflow-y: auto;
        }

        .modal.show {
            display: block;
        }

        .modal-content {
            max-width: 950px;
            margin: 20px auto;
            background: #f4f0e8;
            padding: 35px;
            position: relative;
        }

        .close {
            position: absolute;
            right: 25px;
            top: 20px;
            border: none;
            background: transparent;
            font-size: 28px;
            color: #211b17;
            cursor: pointer;
        }

        .modal-title {
            font-family: Georgia, serif;
            font-size: 28px;
            margin-bottom: 8px;
            padding-right: 30px;
        }

        .modal-subtitle {
            font-size: 13px;
            color: #6f665e;
            margin-bottom: 30px;
        }

        .section-title {
            font-family: Georgia, serif;
            font-size: 21px;
            margin: 25px 0 18px;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .detail-item {
            background: white;
            border: 1px solid #ddd5ca;
            padding: 15px;
            min-width: 0;
        }

        .detail-label {
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #81766d;
            margin-bottom: 8px;
        }

        .detail-value {
            font-size: 13px;
            line-height: 1.7;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .status-form {
            margin-top: 25px;
            padding: 20px;
            background: white;
            border: 1px solid #ddd5ca;
        }

        .status-form label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .status-form select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd5ca;
            background: white;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }

        .empty-message {
            text-align: center;
            padding: 35px;
            color: #766c64;
        }

        @media (max-width: 900px) {
            .sidebar {
                width: 200px;
            }

            .main {
                margin-left: 200px;
                padding: 25px;
            }

            .detail-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 650px) {
            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
                padding: 25px;
            }

            .logo {
                margin-bottom: 25px;
            }

            .nav {
                gap: 5px;
            }

            .logout {
                position: static;
                margin-top: 25px;
                width: 100%;
            }

            .main {
                margin-left: 0;
                padding: 25px;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .admin-info {
                text-align: left;
            }

            .filters {
                flex-direction: column;
            }

            .action-bar {
                align-items: flex-start;
                flex-direction: column;
            }

            .modal {
                padding: 10px;
            }

            .modal-content {
                padding: 25px 18px;
                margin: 10px auto;
            }
        }
    </style>
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="logo">RD ROASTERY</div>

        <div class="admin-label">ADMIN PORTAL</div>

        <nav class="nav">
            <a href="/admin-dashboard.html">Dashboard</a>
            <a href="/admin-products.html">Products</a>
            <a href="/admin-requests.html" class="active">Custom Requests</a>
        </nav>

        <button class="logout" onclick="logout()">LOG OUT</button>
    </aside>

    <!-- MAIN -->
    <main class="main">

        <div class="topbar">
            <h1 class="page-title">Custom Requests</h1>

            <div class="admin-info">
                <strong id="admin-name">Admin RD Roastery</strong>
                <span id="admin-email">admin@rdroastery.com</span>
            </div>
        </div>

        <div id="notice" class="notice"></div>

        <div class="action-bar">
            <div class="request-count" id="request-count">0 REQUESTS</div>

            <button class="add-btn" onclick="loadRequests()">
                ↻ REFRESH REQUESTS
            </button>
        </div>

        <div class="filters">
            <input
                type="search"
                id="search-input"
                class="search-input"
                placeholder="Search business or coffee profile..."
            >

            <select id="status-filter" class="filter-select">
                <option value="">ALL STATUS</option>
                <option value="New">New</option>
                <option value="In Progress">In Progress</option>
                <option value="Sample Roasting">Sample Roasting</option>
                <option value="Completed">Completed</option>
                <option value="Cancelled">Cancelled</option>
            </select>
        </div>

        <div class="table-container">
            <div id="loading" class="loading">Loading custom requests...</div>

            <table id="request-table" style="display:none;">
                <thead>
                    <tr>
                        <th>Request ID</th>
                        <th>Business</th>
                        <th>Coffee Profile</th>
                        <th>Requirement</th>
                        <th>Status</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="request-table-body"></tbody>
            </table>
        </div>

    </main>

    <!-- REQUEST DETAIL MODAL -->
    <div class="modal" id="request-modal">
        <div class="modal-content">
            <button class="close" onclick="closeModal()" aria-label="Close">&times;</button>

            <h2 class="modal-title" id="modal-title">Request Details</h2>
            <p class="modal-subtitle" id="modal-subtitle"></p>

            <h3 class="section-title">Business Information</h3>
            <div class="detail-grid" id="business-details"></div>

            <h3 class="section-title">Coffee Profile Preferences</h3>
            <div class="detail-grid" id="coffee-details"></div>

            <div class="status-form">
                <label for="modal-status">UPDATE REQUEST STATUS</label>

                <select id="modal-status">
                    <option value="New">New</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Sample Roasting">Sample Roasting</option>
                    <option value="Completed">Completed</option>
                    <option value="Cancelled">Cancelled</option>
                </select>

                <button class="add-btn" id="save-status-btn" onclick="saveStatus()">
                    SAVE STATUS
                </button>
            </div>

            <div class="modal-actions">
                <button class="edit-btn" onclick="closeModal()">CLOSE</button>
            </div>
        </div>
    </div>

    <script>
        const API = "/api";

        let requests = [];
        let selectedRequest = null;
        let isSaving = false;

        const $ = id => document.getElementById(id);

        function escapeHTML(value) {
            return String(value ?? "-").replace(/[&<>"']/g, char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            })[char]);
        }

        function field(obj, ...keys) {
            for (const key of keys) {
                if (obj && obj[key] !== undefined && obj[key] !== null) {
                    return obj[key];
                }
            }
            return null;
        }

        function valueOf(value) {
            return value === null || value === undefined || value === ""
                ? "-"
                : String(value);
        }

        function requestId(request) {
            return field(request, "request_id", "id", "requestId");
        }

        function businessName(request) {
            return field(request, "business_name", "businessName") || "Unnamed Business";
        }

        function requestStatus(request) {
            return field(request, "status") || "New";
        }

        function coffeeProfile(request) {
            return field(request, "bean_preference", "beanPreference") || "-";
        }

        function requirement(request) {
            const quantity = field(request, "estimated_quantity", "estimated_monthly_requirement");

            if (quantity === null || quantity === "") return "-";

            const unit = field(request, "quantity_unit", "unit") || "kg";
            return `${quantity} ${unit}`;
        }

        function formatDate(dateValue) {
            if (!dateValue) return "-";

            const date = new Date(dateValue);

            if (Number.isNaN(date.getTime())) {
                return String(dateValue);
            }

            return date.toLocaleDateString("id-ID", {
                day: "2-digit",
                month: "short",
                year: "numeric"
            });
        }

        function statusClass(status) {
            return String(status).toLowerCase().replace(/[^a-z0-9]+/g, "-");
        }

        function showNotice(message, type = "") {
            const notice = $("notice");
            notice.textContent = message;
            notice.className = `notice show ${type}`;
        }

        function hideNotice() {
            $("notice").className = "notice";
            $("notice").textContent = "";
        }

        async function apiRequest(url, options = {}) {
            const response = await fetch(url, {
                ...options,
                headers: {
                    ...(options.headers || {}),
                    ...(options.body ? { "Content-Type": "application/json" } : {})
                }
            });

            const text = await response.text();
            let data = {};

            try {
                data = text ? JSON.parse(text) : {};
            } catch {
                data = { message: text };
            }

            if (!response.ok) {
                throw new Error(data.message || data.error || `HTTP ${response.status}`);
            }

            return data;
        }

        function normalizeRequests(data) {
            if (Array.isArray(data)) return data;
            if (Array.isArray(data.requests)) return data.requests;
            if (Array.isArray(data.data)) return data.data;
            if (Array.isArray(data.custom_requests)) return data.custom_requests;
            return [];
        }

        function renderTable() {
            const search = $("search-input").value.toLowerCase().trim();
            const selectedStatus = $("status-filter").value;
            const tbody = $("request-table-body");

            const filtered = requests.filter(request => {
                const text = [
                    requestId(request),
                    businessName(request),
                    coffeeProfile(request),
                    field(request, "brewing_method"),
                    field(request, "roast_level"),
                    requestStatus(request)
                ].join(" ").toLowerCase();

                return text.includes(search) &&
                    (!selectedStatus || requestStatus(request) === selectedStatus);
            });

            $("request-count").textContent =
                `${filtered.length} OF ${requests.length} REQUESTS`;

            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="empty-message">
                            No custom requests found.
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = filtered.map(request => {
                const id = requestId(request);
                const status = requestStatus(request);

                return `
                    <tr>
                        <td>#${escapeHTML(valueOf(id))}</td>
                        <td>
                            <div class="business-name">${escapeHTML(businessName(request))}</div>
                            <div class="secondary-text">
                                ${escapeHTML(valueOf(field(request, "business_type", "businessType")))}
                            </div>
                        </td>
                        <td>
                            <div class="business-name">${escapeHTML(coffeeProfile(request))}</div>
                            <div class="secondary-text">
                                ${escapeHTML(valueOf(field(request, "brewing_method")))}
                            </div>
                        </td>
                        <td>${escapeHTML(requirement(request))}</td>
                        <td>
                            <span class="status status-${statusClass(status)}">
                                ${escapeHTML(status)}
                            </span>
                        </td>
                        <td>${escapeHTML(formatDate(field(request, "created_at", "createdAt")))}</td>
                        <td>
                            <div class="actions">
                                <button
                                    class="edit-btn"
                                    onclick="viewRequest('${escapeHTML(String(id))}')"
                                >VIEW</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join("");
        }

        async function loadRequests() {
            hideNotice();
            $("loading").style.display = "block";
            $("loading").textContent = "Loading custom requests...";
            $("request-table").style.display = "none";

            try {
                const data = await apiRequest(`${API}/custom-requests`);
                requests = normalizeRequests(data);

                $("loading").style.display = "none";
                $("request-table").style.display = "table";

                renderTable();

                if (requests.length === 0) {
                    showNotice("No custom requests have been submitted yet.");
                }
            } catch (error) {
                $("loading").style.display = "block";
                $("loading").textContent = "Failed to load requests. Please check the server.";
                showNotice(`Unable to load requests: ${error.message}`, "error");
            }
        }

        function detailItem(label, value) {
            return `
                <div class="detail-item">
                    <div class="detail-label">${escapeHTML(label)}</div>
                    <div class="detail-value">${escapeHTML(valueOf(value))}</div>
                </div>
            `;
        }

        function viewRequest(id) {
            selectedRequest = requests.find(
                request => String(requestId(request)) === String(id)
            );

            if (!selectedRequest) {
                showNotice("Request not found. Please refresh the page.", "error");
                return;
            }

            const request = selectedRequest;

            $("modal-title").textContent = `Request #${valueOf(requestId(request))}`;
            $("modal-subtitle").textContent =
                `${businessName(request)} — ${formatDate(field(request, "created_at", "createdAt"))}`;

            $("business-details").innerHTML = [
                detailItem("Business Name", businessName(request)),
                detailItem("Business Type", field(request, "business_type")),
                detailItem("PIC Name", field(request, "pic_name")),
                detailItem("WhatsApp", field(request, "whatsapp")),
                detailItem("Email", field(request, "email")),
                detailItem("Request Date", formatDate(field(request, "created_at")))
            ].join("");

            $("coffee-details").innerHTML = [
                detailItem("Bean Preference", field(request, "bean_preference")),
                detailItem("Brewing Method", field(request, "brewing_method")),
                detailItem("Roast Level", field(request, "roast_level")),
                detailItem("Taste Profile", field(request, "taste_profile")),
                detailItem("Acidity", field(request, "acidity")),
                detailItem("Body", field(request, "body")),
                detailItem("Sweetness", field(request, "sweetness")),
                detailItem("Estimated Quantity", requirement(request)),
                detailItem("Additional Notes", field(request, "additional_notes")),
                detailItem("Current Status", requestStatus(request))
            ].join("");

            $("modal-status").value = requestStatus(request);
            $("request-modal").classList.add("show");
        }

        function closeModal() {
            if (isSaving) return;
            $("request-modal").classList.remove("show");
            selectedRequest = null;
        }

        async function saveStatus() {
            if (!selectedRequest || isSaving) return;

            const id = requestId(selectedRequest);
            const status = $("modal-status").value;

            isSaving = true;
            $("save-status-btn").disabled = true;
            $("save-status-btn").textContent = "SAVING...";

            try {
                await apiRequest(
                    `${API}/custom-requests/${encodeURIComponent(id)}/status`,
                    {
                        method: "PUT",
                        body: JSON.stringify({ status })
                    }
                );

                $("request-modal").classList.remove("show");
                selectedRequest = null;

                showNotice("Request status updated successfully.", "success");
                await loadRequests();
            } catch (error) {
                showNotice(`Failed to update status: ${error.message}`, "error");
            } finally {
                isSaving = false;
                $("save-status-btn").disabled = false;
                $("save-status-btn").textContent = "SAVE STATUS";
            }
        }

        function logout() {
            localStorage.removeItem("rd_admin");
            window.location.href = "/admin-login.html";
        }

        function initializeAdmin() {
            const storedAdmin = localStorage.getItem("rd_admin");

            if (!storedAdmin) {
                window.location.href = "/admin-login.html";
                return;
            }

            try {
                const admin = JSON.parse(storedAdmin);
                $("admin-name").textContent = admin.name || "Admin RD Roastery";
                $("admin-email").textContent = admin.email || "admin@rdroastery.com";
            } catch {
                $("admin-email").textContent = storedAdmin;
            }

            $("search-input").addEventListener("input", renderTable);
            $("status-filter").addEventListener("change", renderTable);

            $("request-modal").addEventListener("click", event => {
                if (event.target === $("request-modal")) closeModal();
            });

            document.addEventListener("keydown", event => {
                if (event.key === "Escape") closeModal();
            });

            loadRequests();
        }

        initializeAdmin();
    </script>

</body>
</html>
